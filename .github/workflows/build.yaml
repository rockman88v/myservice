name: Build
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    uses: rockman88v/platform-ci-cd/.github/workflows/reusable-build.yaml@v1.1
    permissions:
      contents: read
      id-token: write
    with:
      application: myservice
      dockerfile: ./PlayStudios.MyService/PlayStudios.MyService.WebApi/Dockerfile
      docker-context: ./PlayStudios.MyService/PlayStudios.MyService.WebApi/
      image-repository: ${{ secrets.ECR_IMAGE_REPOSITORY }}
      aws-region: ${{ secrets.AWS_REGION }}
      trivy-severity: CRITICAL,HIGH
      trivy-ignore-unfixed: true
      fail-on-vulnerability: true
    secrets: inherit
  dispatch-dev:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch DEV deployment with this exact Build run
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
          BUILD_RUN_ID: ${{ github.run_id }}
        run: gh workflow run deploy-dev.yaml --ref main -f source-sha="$SOURCE_SHA" -f build-run-id="$BUILD_RUN_ID"
