name: Verify STAGING
on:
  workflow_dispatch:
    inputs:
      upstream-run-id:
        description: Successful Promote STAGING workflow run ID
        required: true
        type: string
jobs:
  verify:
    uses: rockman88v/platform-ci-cd/.github/workflows/reusable-verify.yaml@v1.0.0-pipeline
    permissions:
      contents: read
      actions: read
    with:
      runner: test-runner #staging-runner
      environment: staging
      config-file: ./PlayStudios.MyService/PlayStudios.MyService.WebApi/deploy.yaml
      upstream-run-id: ${{ inputs.upstream-run-id }}
    secrets: inherit
  dispatch-promote-production:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch production promotion with this verified run ID
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_RUN_ID: ${{ github.run_id }}
        run: gh workflow run promote-production.yaml --repo "${{ github.repository }}" --ref main -f upstream-run-id="$UPSTREAM_RUN_ID"
