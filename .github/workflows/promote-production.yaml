name: Promote PRODUCTION
on:
  workflow_dispatch:
    inputs:
      upstream-run-id:
        description: Successful Verify STAGING workflow run ID
        required: true
        type: string
jobs:
  promote:
    uses: rockman88v/platform-ci-cd/.github/workflows/reusable-promote.yaml@v1.3
    permissions:
      contents: read
      actions: read
    with:
      source-environment: staging
      environment: production
      config-file: ./PlayStudios.MyService/PlayStudios.MyService.WebApi/deploy.yaml
      upstream-run-id: ${{ inputs.upstream-run-id }}
    secrets: inherit
