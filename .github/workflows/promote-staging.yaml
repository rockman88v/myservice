name: Promote STAGING
on:
  workflow_dispatch:
    inputs:
      upstream-run-id:
        description: Successful Verify DEV workflow run ID
        required: true
        type: string
jobs:
  promote:
    uses: rockman88v/platform-ci-cd/.github/workflows/reusable-promote.yaml@v1.1
    permissions:
      contents: read
      actions: read
    with:
      source-environment: dev
      environment: staging
      config-file: ./PlayStudios.MyService/PlayStudios.MyService.WebApi/deploy.yaml
      upstream-run-id: ${{ inputs.upstream-run-id }}
    secrets: inherit
  dispatch-verify-staging:
    needs: promote
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch STAGING verification with this run ID
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_RUN_ID: ${{ github.run_id }}
        run: gh workflow run verify-staging.yaml --repo "${{ github.repository }}" --ref main -f upstream-run-id="$UPSTREAM_RUN_ID"
