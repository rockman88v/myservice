name: Rollback PRODUCTION

on:
  workflow_dispatch:
    inputs:
      promotion-run-id:
        description: "Successful Promote PRODUCTION workflow run ID to rollback"
        required: true
        type: string

jobs:
  rollback:
    uses: rockman88v/platform-ci-cd/.github/workflows/reusable-rollback.yaml@v1.0.0-pipeline
    permissions:
      contents: read
      actions: write
    with:
      environment: production
      config-file: ./PlayStudios.MyService/PlayStudios.MyService.WebApi/deploy.yaml
      promotion-run-id: ${{ inputs.promotion-run-id }}
      promotion-workflow-name: Promote PRODUCTION
      verify-workflow: verify-production.yaml
    secrets: inherit
