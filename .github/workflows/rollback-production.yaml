name: Rollback PRODUCTION

on:
  workflow_dispatch:
    inputs:
      promotion-run-id:
        description: "Successful Promote PRODUCTION workflow run ID to rollback"
        required: true
        type: string

permissions:
  contents: read
  actions: write

jobs:
  rollback:
    name: Rollback production
    runs-on: ubuntu-latest

    steps:
      # ============================================================
      # 1. Validate the promotion run
      # ============================================================
      - name: Validate promotion run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PROMOTION_RUN_ID: ${{ inputs.promotion-run-id }}
        run: |
          set -euo pipefail

          echo "Validating production promotion run: $PROMOTION_RUN_ID"

          run_json="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${PROMOTION_RUN_ID}")"

          run_name="$(jq -r '.name' <<< "$run_json")"
          run_status="$(jq -r '.status' <<< "$run_json")"
          run_conclusion="$(jq -r '.conclusion' <<< "$run_json")"
          head_repository="$(jq -r '.head_repository.full_name' <<< "$run_json")"

          echo "Run name:        $run_name"
          echo "Run status:      $run_status"
          echo "Run conclusion:  $run_conclusion"
          echo "Repository:      $head_repository"

          [[ "$run_name" == "Promote PRODUCTION" ]] || {
            echo "Specified run is not a Promote PRODUCTION workflow." >&2
            exit 1
          }

          [[ "$run_status" == "completed" ]] || {
            echo "Specified promotion run is not completed." >&2
            exit 1
          }

          [[ "$run_conclusion" == "success" ]] || {
            echo "Specified promotion run did not succeed." >&2
            exit 1
          }

          [[ "$head_repository" == "$GITHUB_REPOSITORY" ]] || {
            echo "Specified promotion run does not belong to this repository." >&2
            exit 1
          }

      # ============================================================
      # 2. Download release-context from EXACT promotion run
      # ============================================================
      - name: Download release context
        uses: actions/download-artifact@v4
        with:
          name: release-context
          path: release-context
          repository: ${{ github.repository }}
          run-id: ${{ inputs.promotion-run-id }}
          github-token: ${{ github.token }}

      # ============================================================
      # 3. Validate release-context
      # ============================================================
      - id: context
        name: Validate release context
        shell: bash
        env:
          EXPECTED_PROMOTION_RUN_ID: ${{ inputs.promotion-run-id }}
        run: |
          set -euo pipefail

          CONTEXT_FILE="release-context/release-context.json"

          [[ -f "$CONTEXT_FILE" ]] || {
            echo "release-context.json not found." >&2
            exit 1
          }

          echo "Release context:"
          jq . "$CONTEXT_FILE"

          promotion_run_id="$(
            jq -er '.promotionRunId | strings | select(test("^[0-9]+$"))' \
              "$CONTEXT_FILE"
          )"

          environment="$(
            jq -er '.environment | strings' \
              "$CONTEXT_FILE"
          )"

          gitops_repository="$(
            jq -er '.gitops.repository | strings' \
              "$CONTEXT_FILE"
          )"

          chart_path="$(
            jq -er '.gitops.chartPath | strings' \
              "$CONTEXT_FILE"
          )"

          values_file="$(
            jq -er '.gitops.valuesFile | strings' \
              "$CONTEXT_FILE"
          )"

          previous_repository="$(
            jq -er '.previousImage.repository | strings' \
              "$CONTEXT_FILE"
          )"

          previous_tag="$(
            jq -er '.previousImage.tag | strings' \
              "$CONTEXT_FILE"
          )"

          previous_digest="$(
            jq -er '.previousImage.digest | strings' \
              "$CONTEXT_FILE"
          )"

          promoted_repository="$(
            jq -er '.promotedImage.repository | strings' \
              "$CONTEXT_FILE"
          )"

          promoted_tag="$(
            jq -er '.promotedImage.tag | strings' \
              "$CONTEXT_FILE"
          )"

          promoted_digest="$(
            jq -er '.promotedImage.digest | strings' \
              "$CONTEXT_FILE"
          )"

          source_sha="$(
            jq -er '.sourceSha | strings | select(test("^[a-fA-F0-9]{40}$"))' \
              "$CONTEXT_FILE"
          )"

          build_run_id="$(
            jq -er '.buildRunId | strings | select(test("^[0-9]+$"))' \
              "$CONTEXT_FILE"
          )"

          [[ "$promotion_run_id" == "$EXPECTED_PROMOTION_RUN_ID" ]] || {
            echo "release-context does not belong to the specified promotion run." >&2
            echo "Expected: $EXPECTED_PROMOTION_RUN_ID" >&2
            echo "Actual:   $promotion_run_id" >&2
            exit 1
          }

          [[ "$environment" == "production" ]] || {
            echo "release-context environment is not production." >&2
            exit 1
          }

          [[ -n "$gitops_repository" ]] || {
            echo "GitOps repository is empty." >&2
            exit 1
          }

          [[ -n "$chart_path" ]] || {
            echo "GitOps chart path is empty." >&2
            exit 1
          }

          [[ -n "$values_file" ]] || {
            echo "GitOps values file is empty." >&2
            exit 1
          }

          [[ -n "$previous_repository" ]] || {
            echo "Previous image repository is empty." >&2
            exit 1
          }

          [[ -n "$previous_tag" ]] || {
            echo "Previous image tag is empty." >&2
            exit 1
          }

          [[ "$previous_digest" == sha256:* ]] || {
            echo "Previous image digest is invalid." >&2
            exit 1
          }

          [[ -n "$promoted_repository" ]] || {
            echo "Promoted image repository is empty." >&2
            exit 1
          }

          [[ -n "$promoted_tag" ]] || {
            echo "Promoted image tag is empty." >&2
            exit 1
          }

          [[ "$promoted_digest" == sha256:* ]] || {
            echo "Promoted image digest is invalid." >&2
            exit 1
          }

          # Export values for later steps.
          {
            echo "gitops-repository=$gitops_repository"
            echo "chart-path=$chart_path"
            echo "values-file=$values_file"

            echo "previous-repository=$previous_repository"
            echo "previous-tag=$previous_tag"
            echo "previous-digest=$previous_digest"

            echo "promoted-repository=$promoted_repository"
            echo "promoted-tag=$promoted_tag"
            echo "promoted-digest=$promoted_digest"

            echo "source-sha=$source_sha"
            echo "build-run-id=$build_run_id"
          } >> "$GITHUB_OUTPUT"

      # ============================================================
      # 4. Checkout current GitOps repository
      # ============================================================
      - name: Checkout production GitOps
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.context.outputs.gitops-repository }}
          token: ${{ secrets.GITOPS_READ_TOKEN }}
          path: gitops
          persist-credentials: false

      # ============================================================
      # 5. Optimistic concurrency check
      #
      # Production MUST still be running the image that this
      # promotion originally deployed.
      #
      # If production has changed since that promotion, STOP.
      # ============================================================
      - name: Verify production still runs promoted image
        continue-on-error: true
        shell: bash
        env:
          VALUES_FILE: gitops/${{ steps.context.outputs.chart-path }}/${{ steps.context.outputs.values-file }}

          EXPECTED_REPOSITORY: ${{ steps.context.outputs.promoted-repository }}
          EXPECTED_TAG: ${{ steps.context.outputs.promoted-tag }}
          EXPECTED_DIGEST: ${{ steps.context.outputs.promoted-digest }}
        run: |
          set -euo pipefail

          [[ -f "$VALUES_FILE" ]] || {
            echo "Production values file not found:"
            echo "$VALUES_FILE"
            exit 1
          }

          current_repository="$(
            python3 - "$VALUES_FILE" <<'PY'
          import sys
          import yaml

          with open(sys.argv[1]) as f:
              values = yaml.safe_load(f)

          print(values["microservice"]["image"]["repository"])
          PY
          )"

          current_tag="$(
            python3 - "$VALUES_FILE" <<'PY'
          import sys
          import yaml

          with open(sys.argv[1]) as f:
              values = yaml.safe_load(f)

          print(values["microservice"]["image"]["tag"])
          PY
          )"

          current_digest="$(
            python3 - "$VALUES_FILE" <<'PY'
          import sys
          import yaml

          with open(sys.argv[1]) as f:
              values = yaml.safe_load(f)

          print(values["microservice"]["image"]["digest"])
          PY
          )"

          echo "Current production image:"
          echo "  Repository: $current_repository"
          echo "  Tag:        $current_tag"
          echo "  Digest:     $current_digest"

          echo
          echo "Expected promoted image:"
          echo "  Repository: $EXPECTED_REPOSITORY"
          echo "  Tag:        $EXPECTED_TAG"
          echo "  Digest:     $EXPECTED_DIGEST"

          if [[ "$current_repository" != "$EXPECTED_REPOSITORY" ]]; then
            echo "ABORT: Production image repository has changed since promotion." >&2
            exit 1
          fi

          if [[ "$current_tag" != "$EXPECTED_TAG" ]]; then
            echo "ABORT: Production image tag has changed since promotion." >&2
            exit 1
          fi

          if [[ "$current_digest" != "$EXPECTED_DIGEST" ]]; then
            echo "ABORT: Production image digest has changed since promotion." >&2
            echo "This rollback is no longer safe to apply automatically." >&2
            exit 1
          fi

          echo
          echo "Production still points to the promoted artifact."
          echo "Rollback is safe to continue."

      # ============================================================
      # 6. Rollback GitOps
      #
      # This creates a NEW GitOps commit.
      # We intentionally DO NOT git revert the promotion commit.
      # ============================================================
      - name: Rollback production image
        uses: rockman88v/platform-ci-cd/.github/actions/update-gitops@v1.6
        with:
          gitops-repository: ${{ steps.context.outputs.gitops-repository }}
          gitops-token: ${{ secrets.GITOPS_WRITE_TOKEN }}

          chart-path: ${{ steps.context.outputs.chart-path }}
          values-file: ${{ steps.context.outputs.values-file }}

          image-tag-path: microservice.image.tag
          image-tag: ${{ steps.context.outputs.previous-tag }}

          image-digest-path: microservice.image.digest
          image-digest: ${{ steps.context.outputs.previous-digest }}

          commit-message: >-
            rollback(myservice):
            restore
            ${{ steps.context.outputs.previous-tag }}
            (${{ steps.context.outputs.previous-digest }})

      # ============================================================
      # 7. Preserve rollback context
      #
      # This is useful for the verification workflow and for
      # audit/debugging.
      # ============================================================
      - name: Create rollback context
        shell: bash
        env:
          PROMOTION_RUN_ID: ${{ inputs.promotion-run-id }}
          ROLLBACK_RUN_ID: ${{ github.run_id }}

          ENVIRONMENT: production

          GITOPS_REPOSITORY: ${{ steps.context.outputs.gitops-repository }}
          CHART_PATH: ${{ steps.context.outputs.chart-path }}
          VALUES_FILE: ${{ steps.context.outputs.values-file }}

          PREVIOUS_REPOSITORY: ${{ steps.context.outputs.previous-repository }}
          PREVIOUS_TAG: ${{ steps.context.outputs.previous-tag }}
          PREVIOUS_DIGEST: ${{ steps.context.outputs.previous-digest }}

          PROMOTED_REPOSITORY: ${{ steps.context.outputs.promoted-repository }}
          PROMOTED_TAG: ${{ steps.context.outputs.promoted-tag }}
          PROMOTED_DIGEST: ${{ steps.context.outputs.promoted-digest }}

          SOURCE_SHA: ${{ steps.context.outputs.source-sha }}
          BUILD_RUN_ID: ${{ steps.context.outputs.build-run-id }}
        run: |
          set -euo pipefail

          jq -n \
            --arg sourceSha "$SOURCE_SHA" \
            --arg buildRunId "$BUILD_RUN_ID" \
            --arg promotionRunId "$PROMOTION_RUN_ID" \
            --arg rollbackRunId "$ROLLBACK_RUN_ID" \
            --arg environment "$ENVIRONMENT" \
            --arg gitopsRepository "$GITOPS_REPOSITORY" \
            --arg chartPath "$CHART_PATH" \
            --arg valuesFile "$VALUES_FILE" \
            --arg previousRepository "$PREVIOUS_REPOSITORY" \
            --arg previousTag "$PREVIOUS_TAG" \
            --arg previousDigest "$PREVIOUS_DIGEST" \
            --arg promotedRepository "$PROMOTED_REPOSITORY" \
            --arg promotedTag "$PROMOTED_TAG" \
            --arg promotedDigest "$PROMOTED_DIGEST" \
            '{
              sourceSha: $sourceSha,
              buildRunId: $buildRunId,
              promotionRunId: $promotionRunId,
              rollbackRunId: $rollbackRunId,
              environment: $environment,
              gitops: {
                repository: $gitopsRepository,
                chartPath: $chartPath,
                valuesFile: $valuesFile
              },
              previousImage: {
                repository: $previousRepository,
                tag: $previousTag,
                digest: $previousDigest
              },
              rolledBackFromImage: {
                repository: $promotedRepository,
                tag: $promotedTag,
                digest: $promotedDigest
              }
            }' > release-context.json

          cat release-context.json

      - name: Upload rollback context
        uses: actions/upload-artifact@v4
        with:
          name: release-context
          path: release-context.json
          if-no-files-found: error
          retention-days: 90

      # ============================================================
      # 8. Trigger production verification
      # ============================================================
      - name: Dispatch PRODUCTION verification
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail

          gh workflow run verify-production.yaml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref main \
            -f upstream-run-id="$UPSTREAM_RUN_ID" \
            -f lifecycle-type="rollback"